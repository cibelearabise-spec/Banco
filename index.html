<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunoPlayer - Music App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 flex justify-center items-center min-h-screen py-10">

    <!-- Container do Aparelho (Simulando Smartphone) -->
    <div class="relative w-[390px] h-[844px] bg-slate-900 text-white rounded-[50px] shadow-2xl overflow-hidden border-[10px] border-slate-800 flex flex-col justify-between">
        
        <!-- Status Bar -->
        <div class="px-7 pt-4 pb-2 flex justify-between items-center text-xs font-semibold tracking-wide z-20">
            <span>9:41</span>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- CONTEÚDO DO APLICATIVO -->
        <div class="relative flex-1 overflow-y-auto px-6 pb-28 pt-2 space-y-6">

            <!-- Header -->
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center font-bold text-sm">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <h1 class="text-base font-bold tracking-tight">SunoPlayer</h1>
                </div>
                <div class="w-9 h-9 bg-slate-800 rounded-full flex items-center justify-center text-slate-300 text-sm">
                    <i class="fa-solid fa-gear"></i>
                </div>
            </div>

            <!-- Card Principal / Capa do Álbum em Destaque -->
            <div class="relative bg-gradient-to-br from-purple-900 via-indigo-900 to-slate-900 p-6 rounded-3xl shadow-xl overflow-hidden border border-purple-500/20">
                <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl"></div>
                
                <div class="w-full h-48 rounded-2xl overflow-hidden shadow-lg relative mb-4">
                    <img id="current-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=600&q=80" alt="Album Art" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent flex items-end p-3">
                        <span class="bg-purple-600/80 backdrop-blur-md text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">AI Generated</span>
                    </div>
                </div>

                <div class="space-y-1">
                    <h2 id="current-title" class="text-lg font-extrabold truncate">Neon Future Beats</h2>
                    <p id="current-artist" class="text-xs text-purple-200">Synthwave AI · Prompt: Upbeat cyberpunk melody</p>
                </div>

                <!-- Barra de Progresso -->
                <div class="space-y-1.5 mt-5">
                    <div class="w-full bg-slate-700/60 h-1.5 rounded-full overflow-hidden cursor-pointer">
                        <div id="progress-bar" class="bg-purple-400 h-full w-1/3 transition-all duration-150"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-purple-300 font-medium">
                        <span id="current-time">1:12</span>
                        <span id="total-time">3:45</span>
                    </div>
                </div>

                <!-- Controles de Reprodução -->
                <div class="flex justify-around items-center mt-5 text-purple-200">
                    <button onclick="toggleShuffle()" class="hover:text-white transition text-sm"><i class="fa-solid fa-shuffle"></i></button>
                    <button onclick="prevTrack()" class="hover:text-white transition text-lg"><i class="fa-solid fa-backward-step"></i></button>
                    <button onclick="togglePlay()" id="play-btn" class="w-14 h-14 bg-white text-slate-950 rounded-full flex items-center justify-center text-xl shadow-lg hover:scale-105 transition">
                        <i id="play-icon" class="fa-solid fa-play ml-0.5"></i>
                    </button>
                    <button onclick="nextTrack()" class="hover:text-white transition text-lg"><i class="fa-solid fa-forward-step"></i></button>
                    <button onclick="toggleRepeat()" class="hover:text-white transition text-sm"><i class="fa-solid fa-repeat"></i></button>
                </div>
            </div>

            <!-- Lista de Faixas Recentes (Playlist) -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-slate-200">Your AI Creations</h3>
                    <span class="text-xs text-purple-400 font-semibold cursor-pointer">See all</span>
                </div>

                <div class="space-y-2.5">
                    <!-- Faixa 1 -->
                    <div onclick="playSong('Neon Future Beats', 'Synthwave AI', 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=600&q=80', '3:45')" class="bg-slate-800/70 hover:bg-slate-800 transition p-3 rounded-2xl flex items-center justify-between cursor-pointer border border-slate-700/40">
                        <div class="flex items-center space-x-3">
                            <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=150&q=80" class="w-11 h-11 rounded-xl object-cover">
                            <div>
                                <h4 class="text-xs font-bold">Neon Future Beats</h4>
                                <p class="text-[11px] text-slate-400">Synthwave AI</p>
                            </div>
                        </div>
                        <div class="text-xs text-slate-400 font-medium">3:45</div>
                    </div>

                    <!-- Faixa 2 -->
                    <div onclick="playSong('Lo-Fi Study Rain', 'Chillhop Generator', 'https://images.unsplash.com/photo-1518609878373-06d740f60d8b?auto=format&fit=crop&w=600&q=80', '2:30')" class="bg-slate-800/70 hover:bg-slate-800 transition p-3 rounded-2xl flex items-center justify-between cursor-pointer border border-slate-700/40">
                        <div class="flex items-center space-x-3">
                            <img src="https://images.unsplash.com/photo-1518609878373-06d740f60d8b?auto=format&fit=crop&w=150&q=80" class="w-11 h-11 rounded-xl object-cover">
                            <div>
                                <h4 class="text-xs font-bold">Lo-Fi Study Rain</h4>
                                <p class="text-[11px] text-slate-400">Chillhop Generator</p>
                            </div>
                        </div>
                        <div class="text-xs text-slate-400 font-medium">2:30</div>
                    </div>

                    <!-- Faixa 3 -->
                    <div onclick="playSong('Cybernetic Symphony', 'Orchestral AI', 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80', '4:15')" class="bg-slate-800/70 hover:bg-slate-800 transition p-3 rounded-2xl flex items-center justify-between cursor-pointer border border-slate-700/40">
                        <div class="flex items-center space-x-3">
                            <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=150&q=80" class="w-11 h-11 rounded-xl object-cover">
                            <div>
                                <h4 class="text-xs font-bold">Cybernetic Symphony</h4>
                                <p class="text-[11px] text-slate-400">Orchestral AI</p>
                            </div>
                        </div>
                        <div class="text-xs text-slate-400 font-medium">4:15</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- MENU INFERIOR FIXO -->
        <div class="absolute bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800/80 px-8 py-3 flex justify-between items-center text-[10px] text-slate-400 z-10">
            <button class="flex flex-col items-center space-y-1 text-purple-400">
                <i class="fa-solid fa-house text-sm"></i>
                <span>Home</span>
            </button>
            <button class="flex flex-col items-center space-y-1 hover:text-white transition">
                <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
                <span>Create</span>
            </button>
            <button class="flex flex-col items-center space-y-1 hover:text-white transition">
                <i class="fa-solid fa-heart text-sm"></i>
                <span>Library</span>
            </button>
            <button class="flex flex-col items-center space-y-1 hover:text-white transition">
                <i class="fa-solid fa-user text-sm"></i>
                <span>Profile</span>
            </button>
        </div>

    </div>

    <!-- Script de Interatividade do Player -->
    <script>
        let isPlaying = false;

        function togglePlay() {
            isPlaying = !isPlaying;
            const playIcon = document.getElementById('play-icon');
            if (isPlaying) {
                playIcon.className = 'fa-solid fa-pause';
            } else {
                playIcon.className = 'fa-solid fa-play ml-0.5';
            }
        }

        function playSong(title, artist, cover, duration) {
            document.getElementById('current-title').innerText = title;
            document.getElementById('current-artist').innerText = artist;
            document.getElementById('current-cover').src = cover;
            document.getElementById('total-time').innerText = duration;
            
            isPlaying = true;
            document.getElementById('play-icon').className = 'fa-solid fa-pause';
            document.getElementById('progress-bar').style.width = '40%';
            document.getElementById('current-time').innerText = '1:00';
        }

        function prevTrack() {
            alert("Música anterior");
        }

        function nextTrack() {
            alert("Próxima música");
        }

        function toggleShuffle() {
            alert("Modo aleatório ativado/desativado");
        }

        function toggleRepeat() {
            alert("Modo repetição ativado/desativado");
        }
    </script>
</body>
</html>
